<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <title>Flower List</title>
</head>
<body>
<header th:replace="~{header-and-footer::Header}">
    <h1>Some header text</h1>
</header>
<main>
    <h2>Flower Catalog</h2>
    <table>
        <tr th:each="f: ${flowers}">
            <td>
                <a th:href="@{/flowers/{id}(id=${f.id})}">
                    <img class="thumb"
                         th:src="@{|/images/flowers/${f.picture.small}|}"
                         th:alt="${f.label}">
                </a>
            </td>
            <td>
                <span class="flower_label" th:text="${f.label}">Aster</span>&nbsp;&nbsp;
                <span class="flower_price" th:text="${#numbers.formatCurrency(f.price)}">&dollar;2.99</span><br>
                <span th:text="${f.description}">
                    The name Aster comes from the Ancient Greek word meaning star,
                    referring to the shape of the flower head."
                </span><br/>
                <a th:href="@{/flowers/{id}(id=${f.id})}">More info</a>
            </td>
        </tr>
    </table>
</main>
<footer th:replace="~{header-and-footer::footer}">
    Some footer text
</footer>
</body>
</html>
